# Plain reverse proxy. Read this file before an interview, because the
# interesting thing about it is what is NOT here.
#
# Nginx ships a rate limiter (the limit_req module). It is deliberately
# unused, and that is the point of the whole project:
#
#   limit_req keys on $binary_remote_addr - an IP address. It has no idea
#   what an API key is, no idea that customer X is on the Pro plan and
#   customer Y is on Free, and no way to find out, because that fact lives
#   in a Postgres row that changes when someone upgrades. Changing a limit
#   would mean editing this file and reloading nginx.
#
# So nginx does what nginx is good at - terminating connections, routing,
# forwarding headers - and the quota decision happens one hop later in the
# API's middleware, where the plan data is actually reachable.

events {
    worker_connections 2048;
}

http {
    upstream api_upstream {
        server api:8000;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        location / {
            proxy_pass http://api_upstream;
        }
    }
}
